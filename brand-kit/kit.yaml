known_gaps:
- No live-site browser rendering or computed CSS succeeded; indexed web text is not a freshness guarantee.
- All six provided screenshot layouts are desktop-style; browser viewport, scale factor and original capture time
  are unknown. No mobile source inspected.
- The service screenshot is low-resolution and contains repeated/seamed regions. It supports overall rhythm, not
  deliberate repetition or readable verification of every sentence.
- No confirmed brand manual, original logo/wordmark/mark variants, favicon, exact typography, official color tokens,
  clear-space rules or motion timings supplied.
- Underlying photographs, identity files, background graphics and icons are reference-only/missing with unknown
  demo and external-AI permissions. Supplied screenshots have narrower reference-sharing scope.
- No live navigation, filter, carousel, form, keyboard/focus or loading/error behavior tested. Their nonvisual behaviors
  are selected extensions.
- Marketing source contains a blue form action unlike the red main action system; new prototypes normalize to red
  as a reversible working choice.
- No application or editorial interface observed. Web-app and image-only contexts are explicitly extended; editorial
  remains not-inspected.
- System specification, prototype users/workflows and project-specific demonstration data must be supplied in the
  next chat. No application has been designed.
- No full dark theme or light-background identity variant is established. The root theme includes local inverse
  surfaces only.
